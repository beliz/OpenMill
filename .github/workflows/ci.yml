name: Tests multi-plateformes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer le projet
        run: python -m pip install -e .
      - name: Vérifier la compilation
        run: python -m compileall -q src tests run.py
      - name: Exécuter les tests métier
        run: python -m unittest discover -s tests -v
      - name: Vérifier le pont Probe Basic simulé
        run: openmill-probe-check --json --smoke-test
