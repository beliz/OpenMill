name: Tests multi-plateformes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer le projet
        run: python -m pip install -e .
      - name: Vérifier la compilation
        run: python -m compileall -q src tests run.py
      - name: Exécuter les tests métier
        run: python -m unittest discover -s tests -v
      - name: Vérifier le pont Probe Basic simulé
        run: openmill-probe-check --json --smoke-test
      - name: Tester l'installateur Probe Basic réversible
        if: runner.os == 'Linux'
        shell: bash
        run: |
          INSTALL_TEST_DIR="$(mktemp -d)"
          mkdir -p "$INSTALL_TEST_DIR/config" "$INSTALL_TEST_DIR/userbase"
          cp tests/fixtures/probe_basic.ini "$INSTALL_TEST_DIR/config/machine.ini"
          PYTHONUSERBASE="$INSTALL_TEST_DIR/userbase" ./installation.sh install --ini "$INSTALL_TEST_DIR/config/machine.ini"
          PYTHONUSERBASE="$INSTALL_TEST_DIR/userbase" ./installation.sh install --ini "$INSTALL_TEST_DIR/config/machine.ini"
          test "$(grep -c 'BEGIN OPENMILL USER TAB' "$INSTALL_TEST_DIR/config/machine.ini")" -eq 1
          test "$(grep -c 'BEGIN OPENMILL SPLASH' "$INSTALL_TEST_DIR/config/machine.ini")" -eq 1
          grep -q '^INTRO_GRAPHIC = openmill-splash.gif$' "$INSTALL_TEST_DIR/config/machine.ini"
          test -f "$INSTALL_TEST_DIR/config/openmill-splash.gif"
          PYTHONUSERBASE="$INSTALL_TEST_DIR/userbase" ./installation.sh check --ini "$INSTALL_TEST_DIR/config/machine.ini"
          PYTHONUSERBASE="$INSTALL_TEST_DIR/userbase" ./installation.sh uninstall --ini "$INSTALL_TEST_DIR/config/machine.ini"
          test ! -e "$INSTALL_TEST_DIR/config/user_tabs/openmill/openmill.py"
          test ! -e "$INSTALL_TEST_DIR/config/openmill-splash.gif"
          ! grep -q '^INTRO_GRAPHIC' "$INSTALL_TEST_DIR/config/machine.ini"
          test ! -e "$INSTALL_TEST_DIR/userbase/lib/python${{ matrix.python }}/site-packages/openmill-conversational.pth"
          mkdir -p "$INSTALL_TEST_DIR/existing-config"
          cp tests/fixtures/probe_basic_existing_splash.ini "$INSTALL_TEST_DIR/existing-config/machine.ini"
          PYTHONUSERBASE="$INSTALL_TEST_DIR/userbase" ./installation.sh install --ini "$INSTALL_TEST_DIR/existing-config/machine.ini"
          grep -q '^INTRO_GRAPHIC = openmill-splash.gif$' "$INSTALL_TEST_DIR/existing-config/machine.ini"
          PYTHONUSERBASE="$INSTALL_TEST_DIR/userbase" ./installation.sh uninstall --ini "$INSTALL_TEST_DIR/existing-config/machine.ini"
          grep -q '^INTRO_GRAPHIC = probebasic.gif$' "$INSTALL_TEST_DIR/existing-config/machine.ini"
